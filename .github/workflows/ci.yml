name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: build
        run: npm run build

      - name: package contents
        run: npm pack --dry-run
